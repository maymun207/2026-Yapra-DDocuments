<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARDICTECH Unified Platform — Architecture v6 · Bilingual SSoT</title>
<style>
:root{
  --bg:#0D1117;--bg2:#161B22;--bg3:#21262D;--bg4:#2D333B;--border:#30363D;--border2:#444C56;
  --text:#E6EDF3;--text2:#8B949E;--text3:#6E7681;
  --core:#58A6FF;--wa:#3FB950;--gu:#E3B341;--cwf1:#BC8CFF;--ins:#F85149;--cwf2:#A371F7;--fin:#79C0FF;
  --purple:#BC8CFF;--green:#3FB950;--amber:#E3B341;--blue:#58A6FF;--red:#F85149;
  --mono:ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.hdr{background:linear-gradient(135deg,var(--bg2),#1C2333);border-bottom:1px solid var(--border);padding:16px 28px;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hdr h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.vb{font-family:var(--mono);font-size:9px;font-weight:700;background:rgba(88,166,255,.14);color:var(--core);border:1px solid var(--core);border-radius:20px;padding:1px 8px;letter-spacing:.06em}
.hdr .sub{font-size:11px;color:var(--text2);font-family:var(--mono);margin-top:3px}
.lang{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px;flex-shrink:0}
.lang button{font-family:var(--mono);font-size:11px;font-weight:700;border:none;background:none;color:var(--text3);cursor:pointer;padding:3px 12px;border-radius:16px;transition:all .15s}
.lang button.on{background:var(--core);color:#0D1117}
.tabs{display:flex;gap:0;margin-top:12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{font-family:var(--mono);font-size:11px;font-weight:600;padding:7px 14px;border:none;background:none;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.04em}
.tab:hover{color:var(--text2)}.tab.active{color:var(--core);border-bottom-color:var(--core)}
.main{padding:24px 28px 80px;max-width:1240px;margin:0 auto}
.sec{display:none}.sec.vis{display:block}
.sect{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:30px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.sect:first-child{margin-top:4px}
.lede{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:16px;max-width:860px}
svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text2);margin:12px 2px 0}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.swb{display:inline-block;width:22px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid var(--border2)}
/* layer/system rows */
.row{display:flex;border:1px solid var(--border);border-radius:8px;background:var(--bg2);overflow:hidden;margin-bottom:7px}
.lbl{flex:0 0 185px;padding:12px 14px;border-right:1px solid var(--border);position:relative;background:var(--bg3)}
.acc{position:absolute;left:0;top:0;bottom:0;width:3px}
.ln{font-family:var(--mono);font-size:11px;color:var(--text3)}
.lname{font-size:13.5px;font-weight:600;color:var(--text);margin-top:1px}
.ltag{font-family:var(--mono);font-size:10.5px;color:var(--amber);margin-top:3px}
.chips{flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;align-content:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12px;color:var(--text)}
.chip.hl{border-color:var(--green);background:rgba(63,185,80,.12);color:var(--green)}
.chip small{font-family:var(--mono);font-size:10.5px;color:var(--text3)}
.grp{font-family:var(--mono);font-size:11px;color:var(--text3);align-self:center;padding:2px 7px;border:1px dashed var(--border2);border-radius:10px}
.tag{font-family:var(--mono);font-size:10.5px;border-radius:10px;padding:1px 6px;border:1px solid}
.t-op{background:rgba(188,140,255,.14);color:var(--purple);border-color:var(--purple)}
.t-so{background:rgba(63,185,80,.14);color:var(--green);border-color:var(--green)}
.t-ha{background:rgba(227,179,65,.14);color:var(--amber);border-color:var(--amber)}
.mtag{font-family:var(--mono);font-size:10.5px;border-radius:10px;padding:0 6px;border:1px solid var(--green);color:var(--green);background:rgba(63,185,80,.14)}
/* type key */
.tk{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:7px}
.tki{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:8px 10px}
.tkb{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:3px;padding:2px 6px;display:inline-block;margin-bottom:5px}
.tkd{font-size:10.5px;color:var(--text2);line-height:1.4}
/* filterable tables */
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.in{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 11px;font-size:12px;font-family:var(--mono);width:230px;outline:none}
.in:focus{border-color:var(--core)}
.sel{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 9px;font-size:12px;font-family:var(--mono);outline:none;cursor:pointer}
.cnt{font-family:var(--mono);font-size:11px;color:var(--text3);margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);padding:8px 9px;border-bottom:1px solid var(--border2)}
td{padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:top}
.cfrom{font-weight:600;color:var(--text);white-space:nowrap}.carr{color:var(--text3);padding:0 4px}.cto{color:var(--text);white-space:nowrap}
.cty{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:3px;padding:1px 6px;white-space:nowrap}
.cproto{font-family:var(--mono);font-size:10.5px;color:var(--blue)}.cpu{color:var(--text2);font-size:11px}
.cph,.cgrp{font-family:var(--mono);font-size:9.5px;border-radius:10px;padding:1px 7px;white-space:nowrap}
.cgrp{background:var(--bg3);border:1px solid var(--border2);color:var(--text2)}
/* plan cards */
.pcard{border:1px solid var(--border);border-radius:10px;background:var(--bg2);margin-bottom:12px;overflow:hidden}
.phead{display:flex;align-items:center;gap:11px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.pdot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.pn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text3)}
.pname{font-size:14px;font-weight:600}
.pmeta{font-family:var(--mono);font-size:11px;color:var(--text3)}
.phrs{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text)}
.pb{font-family:var(--mono);font-size:10px;border-radius:10px;padding:1px 8px}
.b-impl{background:rgba(63,185,80,.14);color:var(--green);border:1px solid var(--green)}
.b-cal{background:rgba(227,179,65,.14);color:var(--amber);border:1px solid var(--amber)}
.b-mix{background:rgba(88,166,255,.14);color:var(--blue);border:1px solid var(--blue)}
.pout{padding:11px 16px;font-size:12.5px;color:var(--text2);line-height:1.55;background:var(--bg3);border-bottom:1px solid var(--border)}
.pout b{color:var(--text);font-weight:500}
.pbody{padding:12px 16px;font-size:12.5px;color:var(--text2);line-height:1.6}
.pbody .o{color:var(--text)}.pbody .dep{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:6px}
.tid{font-family:var(--mono);font-weight:700;color:var(--text);white-space:nowrap;width:46px}
.tname{color:var(--text);font-size:12px}.tdel{color:var(--text2);font-size:11px;font-family:var(--mono);margin-top:2px}
.trole{font-family:var(--mono);font-size:10px;border-radius:10px;padding:1px 7px;white-space:nowrap}
.thrs{font-family:var(--mono);font-size:12px;color:var(--text);text-align:right;white-space:nowrap;width:48px}
.gst{font-family:var(--mono);font-size:11px;color:var(--text);text-align:center}
.gpatch{font-family:var(--mono);font-size:10px;color:var(--green);border:1px solid var(--green);background:rgba(63,185,80,.12);border-radius:10px;padding:1px 7px;white-space:nowrap}
.gopen{font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid var(--amber);background:rgba(227,179,65,.12);border-radius:10px;padding:1px 7px;white-space:nowrap}
.total{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:14px 18px;margin-top:10px;font-size:14px}
.total b{font-family:var(--mono);font-size:18px;color:var(--text)}
.note{border-radius:0 8px 8px 0;padding:12px 15px;font-size:12.5px;line-height:1.6;margin-top:16px;max-width:900px;background:var(--bg2);border:1px solid var(--border)}
.note.purple{border-left:3px solid var(--purple)}.note.green{border-left:3px solid var(--green)}
.note.amber{border-left:3px solid var(--amber)}.note.red{border-left:3px solid var(--red)}
.note b{color:var(--text);font-weight:500}
.opens{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.open{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:0 7px 7px 0;padding:9px 12px;font-size:12px}
.open b{color:var(--amber);font-weight:600;font-family:var(--mono);font-size:11px}.open p{color:var(--text2);margin-top:3px;line-height:1.45}
/* big picture */
.hub{background:rgba(188,140,255,.14);border:1px solid var(--purple);border-radius:10px;padding:14px 18px;text-align:center;margin-bottom:8px}
.hub b{font-size:15px;color:var(--text)}.hub span{font-family:var(--mono);font-size:11px;color:var(--text2);display:block;margin-top:4px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.card h3{font-size:14px;font-weight:600;margin-bottom:6px}.card.p h3{color:var(--purple)}.card.b h3{color:var(--blue)}
.card p{font-size:12.5px;color:var(--text2);line-height:1.6}.card .k{font-family:var(--mono);font-size:11px;color:var(--text3);display:block;margin-top:8px}
.bandrow{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-top:8px}
.bandrow .bt{font-size:13px;font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.col{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px}
.coltitle{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.colsub{font-family:var(--mono);font-size:10.5px;color:var(--text3);margin-bottom:10px}
.cnode{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12px;color:var(--text);margin-bottom:2px}
.cnode.g{border-color:var(--green);background:rgba(63,185,80,.12);color:var(--green)}
.cnode small{display:block;font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:1px}.cnode.g small{color:var(--green)}
.conn{text-align:center;font-family:var(--mono);font-size:10px;color:var(--text3);margin:3px 0}
.down{text-align:center;color:var(--text3);font-family:var(--mono);font-size:11px;margin:4px 0}
footer{max-width:1240px;margin:0 auto;padding:20px 28px;font-size:11px;color:var(--text3);font-family:var(--mono);border-top:1px solid var(--border)}
@media(max-width:760px){.cols,.cards,.opens{grid-template-columns:1fr}}
</style>
</head>

<script>
var lang='en';
var TABS=[['big','sec-big'],['earch','sec-earch'],['econn','sec-econn'],['eplan','sec-eplan'],['rarch','sec-rarch'],['rconn','sec-rconn'],['rplan','sec-rplan']];
function switchTab(id){
  document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('vis')});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.getElementById('sec-'+id).classList.add('vis');
  document.getElementById('tab-'+id).classList.add('active');
}
var T={
en:{
 subtitle:'single source of truth · how we build (Revolutionize) + what we build (EAIP) · internal technical reference',
 footer:'ARDICTECH A.Ş. · Unified Platform architecture v6 · bilingual SSoT · regenerated clean with ADR-001 (LiteLLM) + ADR-002 (MCP) + dev_schedule_patch_v1 · projection, not commitment',
 tabs:{big:'BIG PICTURE',earch:'EAIP · ARCH',econn:'EAIP · CONNECTIVITY',eplan:'EAIP · PLAN',rarch:'REVOLUTIONIZE · ARCH',rconn:'REVOLUTIONIZE · CONNECTIVITY',rplan:'REVOLUTIONIZE · PLAN'},
 big:{title:'How it fits together',
  lede:'Two systems, one loop. Revolutionize is the autonomous engineering organisation: it turns intents into verified pull requests. EAIP is the product platform those PRs assemble into — Web Asistan, Galip Usta, CWF, Insurance, Astra. EAIP\u2019s production telemetry flows back as the reality feed that tells Revolutionize what to build next. Both run on the same sovereign infrastructure, so a decision made in one (LiteLLM gateway, MCP tool protocol) holds in the other.',
  hub:'Revolutionize',hubsub:'virtual SW engineering org · how we build · conductor directs Antigravity · mesh gates every PR',
  ships:'ships verified PRs → components',rf:'reality feed: production → vision',
  eaip:'EAIP — ARDICTECH unified platform',eaipsub:'what we build · 10 layers · 67 components · Web Asistan · Galip Usta · CWF · Insurance · Astra',
  substrate:'Shared sovereign substrate',substrateitems:'Keycloak · Vault · MariaDB Galera · ClickHouse · Redpanda · MinIO · Kubernetes',
  cardph:'Revolutionize — the builder',cardpp:'An autonomous multi-agent organisation. Senior engineers act as conductors directing the execution surface (Antigravity / Claude Code); cells produce work; the verification mesh gates every change. Unit of work = one stage = one prompt = one PR.',cardpk:'v1 simulates a human team → v2 cellular intelligence',
  cardbh:'EAIP — the product',cardbp:'The customer-facing platform built and operated through that loop. Multi-tenant, sovereign-hosted, delivered in phases A–G (Platform Core → Web Asistan → Galip Usta → CWF → Insurance → Astra) over M1–M13.',cardbk:'first tenant: Kale Seramik (CWF) · first email triage: Türk Re',
  note:'<b>Where the patches landed.</b> The two approved ADRs (LiteLLM gateway, MCP tool protocol) only changed the Revolutionize Phase-1 backlog. EAIP already runs LiteLLM as its L3 gateway and already reaches MES, SAP, SharePoint and Salesforce over MCP — including the pre-built ARMES MCP server. The two platforms therefore share the same gateway and tool-protocol decisions, which is what makes the bridge clean.'},
 earch:{lede:'Ten layers from customer channels (L0) down to sovereign infrastructure (L9). Multi-tenant from day one (Keycloak realm + Postgres RLS + Qdrant collection isolation). The two decisions formalised for Revolutionize are already native here: LiteLLM is the L3 model gateway, and MCP is how agents reach external enterprise systems — both highlighted in green.',
  lg1:'platform component',lg2:'LiteLLM / MCP (shared with Revolutionize)',lg3:'amber tag = layer doctrine',
  note:'<b>Why no patch deltas here.</b> The two ADRs only changed the Revolutionize Phase-1 backlog. EAIP already runs LiteLLM as its L3 gateway and already reaches MES, SAP, SharePoint and Salesforce over MCP — including the ARMES MCP server, which is pre-built (✓). The platforms share the same gateway and tool-protocol decisions.'},
 econn:{t1:'Core request lifecycle — the hot path',l1:'Every customer message follows the same spine: a channel pushes it to the gateway, Kong authenticates and applies policy, FastAPI orchestrates, LangGraph reasons, and the LLM call goes through LiteLLM to vLLM. LangGraph fans out to retrieval, state, tools, and tracing on each turn.',
  t2:'Connection-type key',t3:'Full connection reference',
  search:'search component, protocol, purpose…',allty:'all types',allph:'all phases',
  ch:{from:'from',to:'to',type:'type',proto:'protocol',pur:'purpose',phase:'phase'},
  cnt:'connections'},
 eplan:{t1:'Timeline — phases across 13 months',l1:'Phases overlap deliberately: Web Asistan and Galip Usta start while Platform Core is still finishing; CWF v1 (the Kale delivery) runs M3–M5; Insurance triage for Türk Re overlaps it. Astra is the long enterprise tail.',
  t2:'Phase detail — tasks, outcomes, effort',total:'Total programme effort:',totalu:'engineer-hours across 7 phases · M1–M13',
  risk:'<b style="color:var(--red)">Schedule risk — task D4 (ARU/KARU integration).</b> The integration method is unknown until a Week-1 discovery spike: if a REST API exists, ~80h; if UI-only, a Playwright scrape adds ~240h (320h total) and is fragile. This is the single largest schedule uncertainty in the Insurance phase — run the spike first and let it gate the D-phase estimate.',
  tasks_th:'tasks'},
 rarch:{l1:'Five primary systems form one closed loop. Value flows top-down through the four operational systems via the only three sanctioned channels; Meta-cognition observes every system and activates last (Phase 8). The two approved patches both live in the Tool Integration layer.',
  lg1:'primary system',lg2:'cross-cutting layer',lg3:'patched (ADR-approved)',lg4:'reality feed (feedback)',
  t2:'Per-system components — with LLM routing',routing:'Model routing:',routingnote:'resolved by the LiteLLM gateway (ADR-001); untagged = formal / non-LLM or routed at runtime',
  note:'The three channels (intent stream · verification gate · reality feed) are the only sanctioned inter-system paths — the deliberate guard against multi-agent chat proliferation. v1 maps to human team roles for de-risking; each v1 component contains a v2 capability that emerges incrementally on the same substrate. Meta-cognition is built last because it needs 12+ months of accumulated telemetry before its outputs are reliable.'},
 rconn:{t1:'Integration map — the three things every agent touches',l1:'The agent base class (Stage 1.5.1) is the single point where the LLM gateway (ADR-001) and MCP tooling (ADR-002) meet, and where every LLM call and tool call emits telemetry. Agents never call a provider or a tool directly — always through the wrapper or the MCP client.',
  hub:'Agent base class',hubsub:'Stage 1.5.1 · telemetry · LLM gateway · MCP client · capability allowlist',
  colA:'LLM gateway',colAsub:'ADR-001 · LiteLLM',colB:'External tools',colBsub:'ADR-002 · MCP (JSON-RPC)',colC:'Telemetry pipeline',colCsub:'6 layers · agent never waits',
  chTitle:'Three channels',chTag:'Redpanda · append-only',stTitle:'Shared state & security',
  t2:'Connection-type key',t3:'Connection reference',search:'search component, protocol…',allty:'all types',allgr:'all groups',
  ch:{from:'from',to:'to',type:'type',proto:'protocol / call',pur:'purpose',group:'group'},cnt:'connections',
  note:'Invariants enforced by this wiring: the agent never waits for telemetry (fire-and-forget into the mmap ring buffer); PII and secrets are redacted at emission and full prompts live only in the hash-referenced artifact store; secrets are Vault references only; capability access is allowlist (not denylist), enforced at MCP-server boot from the Keycloak JWT; and no agent has production write access by default — shadow agents are read-only.'},
 rplan:{t1:'Timeline — 8 phases, 12–15 months (projection)',l1:'The central scheduling truth: implementation-bound phases compress 50–80% with AI assistance; calendar-bound phases (shadow validation, telemetry maturity, production canaries) compress 0%. Hatched bars are calendar-bound and will not move no matter how fast the team is. This is a projection, not a commitment — phases are completion-gated, not date-gated.',
  lg1:'implementation-bound (compresses 50–80%)',lg2:'mixed (learning curve)',lg3:'calendar-bound (does not compress)',
  t2:'Phase 1 detail — the patched foundation backlog',l2:'Phase 1 is the only phase with a fully decomposed stage backlog (the rest are produced just-in-time). ~42 stages, 6–8 weeks. Stage groups 1.4 and 1.7 run in parallel after 1.3, which is why the patch adds a net of +1 stage but does not move the Phase-1 calendar. Cadence: 3–5 stages/week ramping to 5–10/week. The bottleneck is human review — every PR gets ≥30 min, and verification does not compress.',
  gh:{g:'group',n:'name',s:'stages',o:'expected outcome',c:'change'},
  exit:'<b>Phase 1 exit gate (all five must hold):</b> telemetry flows end-to-end and is queryable; the LiteLLM gateway routes with per-agent cost attribution; MCP servers enforce the capability allowlist at boot; v1 agents ship human-reviewed PRs through the verification gate; and the first product is live in production emitting telemetry.',
  t3:'Phases 2–8 — goals, outcomes, bound-type',l3:'Detailed stage backlogs for these phases are produced just-in-time (when the team is ready to execute), to capture learnings between stages — so they are described here at the phase level by design, not omission.',
  why:'<b style="color:var(--red)">Why Phases 7 and 8 cannot start early.</b> Self-improvement (P7) needs cells generating real production data — it depends on P6, not the calendar. Meta-cognition (P8) genuinely needs 12+ months of accumulated telemetry from P2 onward before its outputs are reliable (the P2 → P8 dependency). Compressing either ships lower-quality v2 components.',
  t4:'Open prerequisites — resolve before / during Phase 1',l4:'These five were unresolved at last review and remain marked OPEN here rather than assumed. Two are effectively answered by the bridge (Revolutionize builds EAIP), but still need an explicit decision.',
  exitgate_lbl:'Exit gate:',outcome_lbl:'Outcome:'}
